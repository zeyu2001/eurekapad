name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
    steps:
      - name: Wait for Vercel Preview URL
        uses: aaimio/vercel-preview-url-action@v2.2.0
        if: ${{ github.event_name == 'pull_request' }}
        id: vercel_preview_url
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          echo "Vercel Preview URL: ${{ steps.vercel_preview_url.outputs.vercel_preview_url }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node LTS ✨
        uses: actions/setup-node@v3
        with:
          cache: pnpm
          node-version: lts/*

      - name: Installing dependencies 📦️
        run: pnpm install

      - name: Deploy 🚀
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm run build:preview
          else
            pnpm run build:deploy
          fi
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          CLERK_ENDPOINT: ${{ vars.CLERK_ENDPOINT }}
          CLERK_JWT_KEY: ${{ vars.CLERK_JWT_KEY }}
          YJS_API_TOKEN: ${{ vars.YJS_API_TOKEN }}
          TRPC_API_URL: ${{ github.event_name == 'pull_request' && steps.vercel_preview_url.outputs.vercel_preview_url || vars.TRPC_API_URL }}
          NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
