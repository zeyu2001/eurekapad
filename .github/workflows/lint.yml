name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Node LTS ✨
        uses: actions/setup-node@v3
        with:
          cache: npm
          node-version: lts/*

      - name: Installing dependencies 📦️
        run: npm install

      - name: Lint 🛀
        run: npm run lint

      - name: Check for formatting 🧹
        run: npm run format:check
